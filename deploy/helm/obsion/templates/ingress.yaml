{{- if .Values.ingress.enabled }}
{{- $fullName := include "obsion.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "obsion.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ .paths.api }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-api
                port:
                  name: http
          - path: {{ .paths.health }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-api
                port:
                  name: http
          - path: {{ .paths.web }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}-web
                port:
                  name: http
    {{- end }}
{{- end }}
