apiVersion: obsion.ai/v1
kind: ReleaseNotes
metadata:
  name: alpha1-live-tenant-evidence
  version: 0.84.0-dev
  phase: 84
spec:
  consolidates: [75, 76, 77, 78, 79, 80, 81, 82, 83]
  migration:
    database: none
    revisions: []
    notes: Phase 84 changes release evidence tooling and probe instrumentation only; Alembic drift must remain empty and no database migration is fabricated.
  documents:
    - CHANGELOG.md
    - Makefile
    - .env.example
    - services/control-plane/src/obsion/cli.py
    - services/control-plane/src/obsion/release/candidate.py
    - services/control-plane/src/obsion/release/live_evidence.py
    - services/control-plane/tests/test_phase84_live_tenant_evidence.py
    - apps/im-adapter/tests/test_feishu.py
    - services/control-plane/tests/test_phase64_feishu_knowledge.py
    - services/control-plane/tests/test_phase65_feishu_wiki_spaces.py
    - services/control-plane/tests/test_phase78_vendor_knowledge_read_gateway.py
    - docs/product/roadmap.md
    - docs/project-status.yaml
    - docs/release/alpha1-candidate-gates.yaml
    - docs/release/alpha1-live-evidence-contract.yaml
    - docs/release/evidence/alpha1/feishu-readonly-live.yaml
    - docs/release/evidence/alpha1/feishu-agent-live.yaml
    - docs/release/sbom.cdx.json
    - docs/release/v1-readiness.md
    - docs/release/0.84.0-dev.md
    - docs/operators/runbook.md
    - docs/phases/PHASE-84-REPORT.md
    - docs/architecture/phase-84-live-tenant-evidence.md
    - docs/adr/0063-alpha1-live-tenant-evidence.md
  boundaries:
    - Alpha.1 remains one Python control plane, one App Server, one Harness, and one versioned Event protocol centered on Workspace, Thread, Turn, Run, Step, and Event.
    - The live evidence ladder reuses the existing opt-in probe tests and production clients; it adds no vendor endpoint, credential flow, transport, Run, Turn, Event, Evidence, Approval, or audit row.
    - Read probes require OBSION_FEISHU_LIVE=1; the write probe still requires the operator's own OBSION_FEISHU_SEND_LIVE=1 and an explicit OBSION_FEISHU_LIVE_CHAT_ID; the recorder never enables the send opt-in itself.
    - "A skip is never a pass: post-opt-in skips, missing probe records, and contract-disallowed outcomes fail closed; ledgers reject credential-shaped values, forbidden keys, failed probes, and checksum tampering."
    - Recorded live-tenant evidence never feeds promotion eligibility; staging, restore drills, registry CVE policy, signatures, live identity infrastructure, human approvals, and publication remain separate operator gates.
    - Generic HTTP delivery, production database writes, deploys, restarts, configuration mutation, and L4-L5 actions remain denied.
  vendors:
    - id: feishu
      environmentVariables:
        - OBSION_FEISHU_APP_ID
        - OBSION_FEISHU_APP_SECRET
        - OBSION_FEISHU_LIVE_CHAT_ID
        - OBSION_LIVE_PROFILE
      experience:
        outboundTransport: feishu-http
        outboundOrigin: https://open.feishu.cn
        inboundSecurity:
          - Public callbacks require TLS, exact Host allowlisting, and verified Lark signatures or configured encryption.
          - Live send validation is disabled unless OBSION_FEISHU_SEND_LIVE=1 and an explicit chat id are present in the operator process environment; the evidence recorder never enables it.
      knowledge:
        connector: obsion-feishu-docs
        origin: https://open.feishu.cn
        operations: [knowledge.ingest, knowledge.sync, knowledge.source.containers, knowledge.source.items]
  rollout:
    - Merge only after the ordinary quality, migration, Java SDK, Helm, filesystem scan, and evaluation jobs pass.
    - Operators record refreshed live evidence with OBSION_FEISHU_LIVE=1, environment credentials, and OBSION_LIVE_PROFILE via make record-feishu-live-evidence; the send probe additionally requires OBSION_FEISHU_SEND_LIVE=1 and OBSION_FEISHU_LIVE_CHAT_ID.
    - "Review validate-release-candidate output: live_evidence_ledgers and live_evidence_probes report recorded coverage while promotionEligible remains false."
  rollback:
    - Revert the Phase 84 commits and remove docs/release/evidence/alpha1/feishu-*-live.yaml together with the liveEvidence section of the candidate contract; missing or uncovered ledgers fail closed by design.
    - No package, image, tag, deployment, database row, or tenant content was created; the single probe message in the operator's ephemeral validation chat is vendor-side test residue from an authorized validation.
    - Do not edit a recorded ledger to restore a green build; re-record live evidence under the operator opt-ins instead.
  verification:
    - make check
    - make test-java
    - make validate-release-candidate-contract
    - uv run pytest --no-cov services/control-plane/tests/test_phase84_live_tenant_evidence.py
    - OBSION_FEISHU_LIVE=1 OBSION_LIVE_PROFILE=readonly make record-feishu-live-evidence
    - OBSION_FEISHU_LIVE=1 OBSION_LIVE_PROFILE=agent OBSION_FEISHU_SEND_LIVE=1 OBSION_FEISHU_LIVE_CHAT_ID=<operator chat> make record-feishu-live-evidence
  knownLimitations:
    - The repository does not claim a staging deployment, UAT, timed DR drill, live OIDC or secret-manager validation, signed image, signed tag, external package, or production promotion.
    - Live evidence is recorded against one operator tenant at one revision; ledgers are point-in-time audit records, not continuous conformance monitoring.
    - DingTalk, WeCom, public TLS ingress, and permitted Feishu document/wiki content remain operator-owned; the ladder records correct fail-closed denial for ungranted scopes rather than fabricating access.
    - Package versions remain 0.1.0 while the development release line is 0.84.0-dev; external version alignment requires a separately authorized publication phase.
    - Real DingTalk, WeCom, Confluence, and permitted Feishu tenant content remain operator-owned; release validation never reads worker.txt or ci.txt.
