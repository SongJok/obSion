  boundaries:
    - Alpha.1 remains one Python control plane, one App Server, one Harness, and one versioned Event protocol; this phase changes no backend route, schema, or permission and renders only persisted CHART artifact content.
    - The renderer implements exactly the bar, line, and text subset the Harness emits and does not execute arbitrary Vega-Lite specs, keeping the client trust boundary narrow and dependency-free.
    - Rendering is fail-closed; unknown marks fall back to bar, content without numeric values shows an explicit notice, and no data series is ever fabricated.
    - The producer contract is pinned by control-plane tests so renderer and producer cannot drift.
    - Recorded evidence, the candidate contract, and the six PENDING operator gates are untouched; nothing in this phase feeds promotion eligibility.
  vendors: []
  rollout:
    - Merge only after the ordinary quality, migration, Java SDK, Helm, filesystem scan, and evaluation jobs pass.
    - No migration, environment, or configuration change is required; existing CHART artifacts render with the correct mark immediately.
  rollback:
    - Revert the phase commits; every CHART artifact returns to the horizontal-bar rendering regardless of mark.
  verification:
    - npx vitest run tests/chart-spec.test.ts
    - uv run pytest --no-cov services/control-plane/tests/test_phase95_chart_renderer.py
    - make check
    - make test-java
    - make validate-release-candidate-contract
  knownLimitations:
    - The renderer implements exactly the bar, line, and text subset the Harness emits; richer marks such as area, scatter, or color series would require producer changes first.
    - All six Alpha.1 candidate gates remain PENDING operator-owned items.
