  boundaries:
    - Alpha.1 remains one Python control plane, one App Server, one Harness, and one versioned Event protocol; this phase adds two additive response fields to the member view and completes Web coverage of an existing collaboration contract, changing no runtime, schema, capability, or authorization rule.
    - Assignee and source-Run validation stay entirely server-side; the member and Run selectors are UX aids and never widen who can be assigned or which Runs can be linked.
    - Provenance rendering uses only the persisted source_run_id; a Run outside the bounded option window still renders as a truncated id and no relationship is ever inferred or fabricated.
    - Task edits keep the optimistic-concurrency contract so only changed fields travel with expected_version, clearing an assignee is an explicit null, and source_run_id remains create-only exactly as the backend schema requires.
    - The source-Run link reuses the Workbench loadInspection bundle; no second loading path, URL scheme, or endpoint was introduced.
    - Recorded evidence, the candidate contract, and the six PENDING operator gates are untouched; nothing in this phase feeds promotion eligibility.
  vendors: []
  rollout:
    - Merge only after the ordinary quality, migration, Java SDK, Helm, filesystem scan, and evaluation jobs pass.
    - No migration, environment, or configuration change is required.
  rollback:
    - Revert the phase commits; the member view loses the two additive fields and the Workbench returns to the read-only collaboration surface.
  verification:
    - npm test --workspace @obsion/web
    - uv run pytest --no-cov services/control-plane/tests/test_phase92_collaboration_assignment.py
    - npm run typecheck --workspace @obsion/web
    - npm run lint --workspace @obsion/web
    - npm run build --workspace @obsion/web
    - make check
    - make test-java
    - make validate-release-candidate-contract
  knownLimitations:
    - The source-Run selector lists runs from active threads only with the newest 50 offered; older Runs remain valid provenance targets via the persisted id.
    - Member management (add and remove members) remains API-only and is not part of this phase.
    - All six Alpha.1 candidate gates remain PENDING operator-owned items.
