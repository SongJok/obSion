  boundaries:
    - Alpha.1 remains one Python control plane, one App Server, one Harness, and one versioned Event protocol; this phase changes no backend route, schema, or permission and adds tests plus a two-statement reorder in the Web mutation handler.
    - The interaction suite mocks only the API boundary with production-identical types and ApiError identity, and asserts the exact payloads crossing it.
    - No new dependency — interactions use fireEvent from the already pinned Testing Library, and globals stay off with explicit cleanup.
    - Collaboration error guidance now survives the follow-up refresh it triggers; the ordering is pinned by tests.
    - Recorded evidence, the candidate contract, and the six PENDING operator gates are untouched; nothing in this phase feeds promotion eligibility.
  vendors: []
  rollout:
    - Merge only after the ordinary quality, migration, Java SDK, Helm, filesystem scan, and evaluation jobs pass.
    - No migration, environment, or configuration change is required.
  rollback:
    - Revert the phase commits; the mutation handler returns to message-then-refresh ordering and the interaction suite is removed.
  verification:
    - npx vitest run tests/workbench-interactions.test.tsx
    - uv run pytest --no-cov services/control-plane/tests/test_phase97_workbench_interactions.py
    - make check
    - make test-java
    - make validate-release-candidate-contract
  knownLimitations:
    - Interaction coverage targets the three most operator-critical surfaces; deeper suites for automation authoring and inspector tabs remain incremental work.
    - All six Alpha.1 candidate gates remain PENDING operator-owned items.
