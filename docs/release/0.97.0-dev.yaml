  boundaries:
    - Alpha.1 remains one Python control plane, one App Server, one Harness, and one versioned Event protocol; this phase changes no backend route, schema, or permission and adds tests plus scoped Workbench interaction and accessibility fixes.
    - The interaction suites mock only the API boundary with production-identical types and ApiError identity, and assert the exact payloads and response envelopes crossing it.
    - Automation lifecycle interactions cover immutable version derivation and publication, validated manual triggers, schedule creation, and guarded retirement; strict TypeScript checking pins the production publish response envelope.
    - Runtime inspector tabs implement one selected and keyboard-focusable tab, tab-to-panel association, and ArrowLeft/ArrowRight/Home/End navigation without introducing a second state source.
    - Governance-console interactions exercise independent domain degradation, stable-sender IM binding and revocation, and Connector SDK health/discovery/scan/promotion through the typed Admin API boundary; discovery remains non-binding and backend Policy/approval/audit controls remain authoritative.
    - Governed Action interactions expose only development/staging draft creation and preserve idempotency, operator preflight declarations, independent approval reasons, rollback reasons, and API-mediated cancellation; production remains absent from the form and backend Policy remains authoritative.
    - Governed Action draft, approval, and reason surfaces expose named dialog roles and modal semantics without changing validation or authorization.
    - Studio kind and version selection clears comparison state, uses accessible roving tabs, and keeps Workflow validation-only plus comparison traffic_split=false.
    - Eval initial cases load once; dataset changes clear candidate/baseline/results/compare state; self-comparison is excluded; case and run-binding JSON must be objects with string Run IDs before transport.
    - Knowledge clears prior Evidence before each trimmed authorized query, keeps failed searches empty, and exercises ACL-bearing upload plus vendor-specific Gateway routes without reading credentials.
    - Data lineage is generation-scoped so close or metric switches invalidate late responses; definition and lineage modes use accessible roving tabs and render only API-provided read-only lineage.
    - Code search clears old symbols, trims the query, distinguishes authorized-empty from transport failure, and accepts results only from the latest request generation.
    - Workspace Files derives a safe path from the selected filename instead of a fabricated default; Files and Artifacts preserve Workspace classification/lineage metadata, expose named upload inputs, and exercise history/filter/preview/download/ID-preserving refresh.
    - Reports, Dashboards, SQL, Evidence, and Timeline render scoped persisted Artifact/Evidence/Event facts; Dashboard references are non-empty strings, trimmed and deduplicated, and a new successful detail clears a prior panel error without inventing panels.
    - Frozen-contract wheel validation uses the real locked Hatchling backend with no build isolation and offline mode; exact packaged-resource equality remains mandatory and the regenerated SBOM records the updated dev build closure.
    - No new dependency — interactions use fireEvent from the already pinned Testing Library, and globals stay off with explicit cleanup.
    - Collaboration error guidance now survives the follow-up refresh it triggers; the ordering is pinned by tests.
    - Recorded evidence, the candidate contract, and the six PENDING operator gates are untouched; nothing in this phase feeds promotion eligibility.
  vendors: []
  rollout:
    - Merge only after the ordinary quality, migration, Java SDK, Helm, filesystem scan, and evaluation jobs pass.
    - No migration, environment, or configuration change is required.
  rollback:
    - Revert the phase commits; the mutation handler returns to message-then-refresh ordering, Runtime inspector tabs return to pointer-only visual buttons, and the interaction suites are removed.
