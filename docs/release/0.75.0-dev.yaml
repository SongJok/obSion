apiVersion: obsion.ai/v1
kind: ReleaseNotes
metadata:
  name: vendor-integration-consolidation
  version: 0.75.0-dev
  phase: 75
spec:
  consolidates: [68, 69, 70, 71, 72, 73, 74]
  migration:
    database: none
    revisions: []
    notes: Phases 68-75 add no database schema revision; run Alembic drift checks but do not fabricate a migration.
  documents:
    - CHANGELOG.md
    - README.md
    - connectors/README.md
    - docs/release/0.75.0-dev.md
    - docs/operators/administrator.md
    - docs/operators/deployment.md
    - docs/operators/runbook.md
    - docs/operators/upgrade.md
    - docs/phases/PHASE-68-REPORT.md
    - docs/phases/PHASE-69-REPORT.md
    - docs/phases/PHASE-70-REPORT.md
    - docs/phases/PHASE-71-REPORT.md
    - docs/phases/PHASE-72-REPORT.md
    - docs/phases/PHASE-73-REPORT.md
    - docs/phases/PHASE-74-REPORT.md
    - docs/phases/PHASE-75-REPORT.md
    - docs/architecture/phase-75-release-notes-consolidation-gate.md
    - docs/adr/0054-machine-validated-release-notes.md
  boundaries:
    - IM ingress and delivery remain Experience clients of the single App Server and never host a Harness loop.
    - Knowledge document access remains a Capability Gateway path protected by Policy, connector grants, ACL, rate limits, and audit.
    - Vendor credentials are environment or secret-manager inputs and never enter Agent context, manifests, release notes, or events.
    - Generic HTTP delivery, invented organization ACL, marketplace installation, and a second control-plane language remain forbidden.
    - Production actions and production data writes remain denied.
  vendors:
    - id: feishu
      environmentVariables:
        - OBSION_FEISHU_APP_ID
        - OBSION_FEISHU_APP_SECRET
        - OBSION_FEISHU_ENCRYPT_KEY
        - OBSION_FEISHU_VERIFICATION_TOKEN
        - OBSION_IM_PUBLIC_HOSTS
        - OBSION_IM_TLS_CERT
        - OBSION_IM_TLS_KEY
      experience:
        outboundTransport: feishu-http
        outboundOrigin: https://open.feishu.cn
        inboundSecurity:
          - TLS and Host allowlist are mandatory for a public listener.
          - X-Lark-Signature is verified and encrypted callbacks use the configured Encrypt Key.
      knowledge:
        connector: obsion-feishu-docs
        origin: https://open.feishu.cn
        operations: [knowledge.ingest, knowledge.sync]
    - id: dingtalk
      environmentVariables:
        - OBSION_DINGTALK_APP_KEY
        - OBSION_DINGTALK_APP_SECRET
        - OBSION_IM_PUBLIC_HOSTS
        - OBSION_IM_TLS_CERT
        - OBSION_IM_TLS_KEY
        - OBSION_IM_WEBHOOK_SECRET
      experience:
        outboundTransport: dingtalk-http
        outboundOrigin: https://oapi.dingtalk.com
        inboundSecurity:
          - TLS and Host allowlist are mandatory for a public listener.
          - Public ingress requires the DingTalk app secret or the shared webhook secret.
      knowledge:
        connector: obsion-dingtalk-docs
        origin: https://api.dingtalk.com
        operations: [knowledge.ingest, knowledge.sync]
    - id: wecom
      environmentVariables:
        - OBSION_WECOM_CORP_ID
        - OBSION_WECOM_CORP_SECRET
        - OBSION_WECOM_AGENT_ID
        - OBSION_WECOM_TOKEN
        - OBSION_WECOM_ENCODING_AES_KEY
        - OBSION_IM_PUBLIC_HOSTS
        - OBSION_IM_TLS_CERT
        - OBSION_IM_TLS_KEY
      experience:
        outboundTransport: wecom-http
        outboundOrigin: https://qyapi.weixin.qq.com
        inboundSecurity:
          - TLS and Host allowlist are mandatory for a public listener.
          - EncodingAESKey and Token are mandatory for public encrypted callbacks.
      knowledge:
        connector: obsion-wecom-docs
        origin: https://qyapi.weixin.qq.com
        operations: [knowledge.ingest, knowledge.sync]
  rollout:
    - Back up PostgreSQL and the artifact bucket, then verify Alembic reports no drift.
    - Inject vendor credentials, TLS material, and callback secrets through the deployment secret manager; never write values into Helm, TOML, or connector YAML.
    - Allow only the declared HTTPS origins at the network and connector layers.
    - Deploy the control plane, Workbench, and separately managed obsion-im process from one tested release revision.
    - Import or reconcile the vendor Knowledge connector manifests and review sync budgets, rate limits, grants, and explicit ACL policy.
    - Bind stable vendor sender ids to provisioned Users before accepting messages.
    - Start with loopback or staging callbacks, then enable public TLS only after DNS, Host allowlist, and vendor verification succeed.
    - Run the release verification commands and vendor smoke matrix before promoting traffic.
  rollback:
    - Disable affected IM delivery transports and Knowledge connector bindings before changing images.
    - Preserve IM delivery receipts, Runtime Events, Evidence, provenance, and audit rows; never repair them with direct SQL.
    - Roll the control plane, Workbench, and obsion-im process back to the previous tested image set.
    - Restore previous secret references and egress policy without exposing secret material.
    - No Alembic downgrade is required for this release because it has no database revision.
    - Re-run loopback IM and internal Knowledge smoke checks before restoring vendor traffic.
  verification:
    - uv run obsion validate-release-notes
    - uv run obsion scan-secrets
    - uv run obsion validate-registry
    - uv run pytest --no-cov services/control-plane/tests/test_phase75_release_notes.py
    - make check
  knownLimitations:
    - Live tenant application scopes, public DNS, certificates, callback registration, and vendor-side rate limits remain operator-owned.
    - Passing mocked HTTP tests does not constitute a successful live Feishu, DingTalk, or WeCom tenant rollout.
    - Missing upstream ACL or provenance fields fail closed or remain explicitly unrecorded; Obsion does not invent organization-wide access.
    - The Helm chart does not automatically create vendor applications or put their credentials into values.
    - Staging deployment, timed disaster-recovery rehearsal, and human security sign-off remain open release prerequisites.
