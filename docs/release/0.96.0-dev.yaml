  boundaries:
    - Alpha.1 remains one Python control plane, one App Server, one Harness, and one versioned Event protocol; this phase changes no backend route, schema, or permission and composes the existing collaboration endpoints.
    - Claim actions appear only for COMPLETED runs pinned to a workspace context, and the target workspace always comes from the run's pinned context rather than ambient session state.
    - Created tasks and decisions carry source_run_id so provenance survives into the collaboration ledger; cross-workspace attempts keep failing closed with workspace_source_run_mismatch.
    - Claims are rendered and never altered; the modal edits only the new record's payload, and nothing is written without operator confirmation.
    - Recorded evidence, the candidate contract, and the six PENDING operator gates are untouched; nothing in this phase feeds promotion eligibility.
  vendors: []
  rollout:
    - Merge only after the ordinary quality, migration, Java SDK, Helm, filesystem scan, and evaluation jobs pass.
    - No migration, environment, or configuration change is required; the actions call existing collaboration endpoints.
  rollback:
    - Revert the phase commits; the claims tab returns to read-only rendering.
  verification:
    - npx vitest run tests/claim-actions.test.ts
    - uv run pytest --no-cov services/control-plane/tests/test_phase96_claim_actions.py
    - make check
    - make test-java
    - make validate-release-candidate-contract
  knownLimitations:
    - Actions appear only for COMPLETED runs pinned to a workspace context; ad-hoc runs outside a workspace stay read-only.
    - All six Alpha.1 candidate gates remain PENDING operator-owned items.
