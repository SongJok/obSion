  boundaries:
    - Alpha.1 remains one Python control plane, one App Server, one Harness, and one versioned Event protocol; this phase changes no backend route, schema, permission, or worker behaviour and surfaces only what the automation API already enforces.
    - Workflow versions stay immutable; the Workbench derives new versions from existing specs and never mutates a published spec in place, and publishing an older version remains guarded by the backend workflow_retired rejection.
    - Trigger and schedule input payloads are validated client-side before submission, idempotency keys keep the existing web-uuid generation, and the automation.manage permission and per-run owner checks are unchanged.
    - No credential material is solicited, stored, or rendered anywhere in the new authoring surface; payloads are operator-supplied business parameters only.
    - Recorded evidence, the candidate contract, and the six PENDING operator gates are untouched; nothing in this phase feeds promotion eligibility.
  vendors: []
  rollout:
    - Merge only after the ordinary quality, migration, Java SDK, Helm, filesystem scan, and evaluation jobs pass.
    - No migration, environment, or configuration change is required; the new authoring actions call existing automation endpoints.
  rollback:
    - Revert the phase commits; the Automation workbench returns to create, publish-latest, pause/activate, empty-payload trigger, and review only.
  verification:
    - npx vitest run tests/automation-authoring.test.ts
    - uv run pytest --no-cov services/control-plane/tests/test_phase94_automation_authoring.py
    - make check
    - make test-java
    - make validate-release-candidate-contract
  knownLimitations:
    - Schedules remain enable/disable only after creation; editing a schedule means creating a new one, matching the backend contract.
    - Step artifact output refs render as labeled chips; opening the artifact itself stays in the Artifacts view.
    - All six Alpha.1 candidate gates remain PENDING operator-owned items.
