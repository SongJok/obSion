  boundaries:
    - One Python control plane, one App Server, one Harness, and one versioned Event protocol remain authoritative.
    - Workspace, Thread, Turn, Run, Step, and Event remain the durable execution hierarchy.
    - Every external Capability crosses Policy, grants, schemas, rate, credentials, masking, telemetry, Evidence when Run-scoped, and Audit.
    - Model providers remain behind logical ModelProfiles and cannot grant tool authority.
    - Factual answers require Claims, Evidence, confidence, source, timestamp, and independent Critic verification.
    - Vendor source operations use the no-Run Capability Gateway without fabricated Runs or Evidence.
    - Credentials remain secret-manager or process-environment inputs and never enter Agents, manifests, Events, model context, or release notes.
    - Production database writes, deploys, restarts, config mutations, generic HTTP delivery, and L4-L5 actions remain denied.
    - PostgreSQL is the V1 transactional source of truth; Kafka and ClickHouse are not introduced as a base.
    - Java remains a REST SDK client of the Python control plane and is not a second backend.
