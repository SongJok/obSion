  rollout:
    - Reproduce make check, JDK 21 SDK tests, Alembic drift, and the CycloneDX SBOM from one clean revision.
    - Back up PostgreSQL and object storage and prove restore before changing traffic.
    - Deploy to clean staging with OIDC, external secrets, exact TLS origins, NetworkPolicy, OTLP, and read-only data identities.
    - Reconcile Registry definitions, immutable versions, connector bindings, grants, rate limits, egress, and Knowledge sync budgets.
    - Run authorized and denied Knowledge, Data, Engineering, Incident, replay, cancellation, approval, and Workspace flows.
    - Enable vendor source browsing before ingest or sync and verify ACL and provenance with tenant-owned fixtures.
    - Review UNKNOWN Operator Capability invocations and connector-specific reconciliation procedures.
    - Record UAT, timed DR, image/CVE/signature, security, and data-owner evidence before production promotion.
  rollback:
    - Disable affected connector bindings, workers, and vendor delivery transports without deleting durable records.
    - Preserve Runs, Events, Evidence, Claims, Artifacts, delivery receipts, Audit, and operator idempotency ledgers.
    - Reconcile every UNKNOWN external outcome before issuing a new request UUID.
    - Restore the previous tested image, configuration, network policy, and secret references.
    - Restore PostgreSQL and object storage into a separate verified environment when schema rollback is required.
    - Re-run internal read-only smoke flows before restoring traffic.
  verification:
    - make check
    - make test-java with JDK 21
    - uv run obsion validate-release-notes
    - uv run obsion scan-secrets
    - uv run obsion validate-contracts
    - uv run obsion validate-eval-gates
    - PostgreSQL operator invocation concurrency and isolated migration round-trip tests
    - Explicit non-writing Feishu Capability Gateway browse with operator process credentials
  knownLimitations:
    - This manifest does not create an external tag, signed source release, package, image, or deployment approval.
    - Staging, UAT, timed DR, live OIDC and secret manager, registry HIGH-CVE policy, and human security or data-owner sign-off remain operator-owned.
    - Real permitted Feishu document ingest and citations and all live DingTalk, WeCom, and Confluence tenant checks remain operator-owned.
    - Remote MCP or gRPC, stdio spawn, third-party SDK loading, external workflow engines, nested Harness agents, and OS cgroup enforcement are not claimed.
    - RUN_OUTPUT Golden Dataset fixtures require real terminal Run bindings and are not counted as passing when skipped.
    - Production writes, deploys, restarts, and configuration mutation remain outside the Alpha.1 release boundary.
