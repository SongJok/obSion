apiVersion: obsion.ai/v1
kind: ReleaseNotes
metadata:
  name: alpha1-workbench-reliability
  version: 0.88.0-dev
  phase: 88
spec:
  consolidates: [75, 76, 77, 78, 79, 80, 81, 82, 83, 84, 85, 86, 87]
  migration:
    database: none
    revisions: []
    notes: No schema, settings, or API changes; Phase 88 hardens Workbench, Desktop, and IDE client code plus documentation only.
  documents:
