known_issues:
  - Alpha.1 is a repository-local, clean-snapshot-validated and CI-reproducible release candidate only; no external tag, package, image, signature, or deployment promotion was created.
  - Staging deploy, UAT, and human security sign-off were not executed in this environment.
  - CI Trivy covers unfixed CRITICAL findings; HIGH CVE policy and live OIDC remain operator-owned.
  - Backup/restore is documented; Phase 85 records a repository-local timed PostgreSQL drill ledger (8/8 checks, 89-table parity, revision d4c6650) and Phase 86 records the companion artifact-store drill ledger (8/8 checks, object/content/metadata parity plus database-reference consistency) under docs/release/evidence/alpha1/. The staging-scoped timed restore remains operator-owned. Phase 85 also fixed the latent verification-admission trigger defect the drill discovered (Alembic b88f1c4d5e60).
  - CLI, IDE, IM, and Desktop App Server coverage against a live WebSocket cluster is operator-owned; in-process tests use REST reconciliation plus a scripted App Server transport.
  - VS Code host packaging of `@obsion/ide-extension` against a remote cluster is operator-owned.
  - Electron packaging of `@obsion/desktop` against a signed installer remains operator-owned.
  - Feishu, DingTalk, and WeCom outbound HTTP, inbound signatures/AES, and public TLS ingress are implemented. Generic `--deliver http` is still rejected. Phase 76 verified Feishu tenant authentication plus non-sending document/wiki denial or read behavior with real credentials; Phases 78-79 verified real no-write Feishu browsing through the REST-to-Capability-Gateway path. Phase 84 records the full Feishu live ladder as redacted, checksummed, candidate-gate-validated ledgers under `docs/release/evidence/alpha1/`: tenant authentication, chat discovery, fail-closed document/wiki/browse denial on ungranted scopes, and a single-message live delivery (vendor message id om_x100b666298f33ca8c2b188749811eb0) through the production `feishu-http` channel into the Phase 81 ephemeral validation chat. A permitted live document, public DNS/TLS, and all DingTalk/WeCom tenants remain operator-owned. Feishu, DingTalk, WeCom, and Confluence Knowledge ingest/sync and browse are implemented with shared budgets and provenance contracts. Phases 77-78 route all vendor REST source writes and reads through the no-Run Capability Gateway with Policy, grants, schema, rate, credentials, masking, telemetry, and Audit. Phase 79 adds durable principal-scoped terminal replay, mismatch/in-progress conflict, and fail-closed UNKNOWN reconciliation for no-Run L2 idempotent writes. Workbench and all three SDKs expose content-free reconciliation metadata without inventing Evidence.
  - MCP, SDK, gRPC, WORKFLOW, and AGENT are in-process adapters only. Remote MCP servers, stdio spawn, third-party SDK installs, remote gRPC channels, Temporal/Airflow engines, and nested Harness agent loops are not implemented. WORKFLOW `workflow_id` dispatch reuses AutomationService with a depth-1 recursion budget.
  - The Java SDK is a REST client of the Python control plane. It does not speak App Server WebSocket and is not a second backend. The Connector SDK SPI is Python-only (`health`/`discover`/`execute`); it does not pip-install tenant modules or load remote connectors. Plugin scan is static HMAC over the declaration, not binary/GPG provenance.
  - Agent sandbox CPU/memory/disk/process fields are declared and pinned; this control plane does not apply cgroups or start a container runtime.
  - Studio compare/rollback does not split Harness traffic. Prompt templates are immutable snapshots pinned on each Turn/Run; they are not rewritten in place. Template interpolation is schema-bound and does not accept user-turn variables.
  - Context token budget decisions are extractive and pinned on the Run. SUMMARIZE is not an LLM abstract. Conversation compaction keeps recent turns and extractively previews older ones. Workspace Context is pinned on the Run; description is untrusted. TOOL evidence is a separate untrusted `tool-result` segment. Runtime SLO is a PostgreSQL average/rate projection, not an OTel p95 SLA. Workspace Files/Reports/Dashboards/SQL/Evidence/Timeline are published or persisted projections and do not invent rows.

next_phase:
  id: phase-91
  name: alpha1-operator-promotion
  blocked: true
  notes: Phase 90 turned the Runtime timeline into a per-stage
    investigation narrative projected from persisted keys only —
    RunStep timestamps for duration, Evidence.step_id for step
    attribution, and Claim.evidence_ids for conclusion support — with
    bounded evidence chips, claim badges that jump to the Claims tab,
    and an explicit section for evidence without a step. No link is
    inferred, no prose is generated, and no API or schema changed. ADR
    0069 records the decisions. Production promotion remains fail-closed
    while clean staging/UAT, staging-scoped timed restore, registry
    HIGH/CRITICAL CVE policy, signatures, live
    OIDC/secret-manager/read-replica evidence, security and data-owner
    approval, and maintainer publication authority are PENDING. Phase 91
    may consume real operator evidence; it must not fabricate approval,
    publish with ci.txt credentials, expand production writes, or add a
    second runtime without explicit authority.
