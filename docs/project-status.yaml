  - Context token budget decisions are extractive and pinned on the Run. SUMMARIZE is not an LLM abstract. Conversation compaction keeps recent turns and extractively previews older ones. Workspace Context is pinned on the Run; description is untrusted. TOOL evidence is a separate untrusted `tool-result` segment. Runtime SLO is a PostgreSQL average/rate projection, not an OTel p95 SLA. Workspace Files/Reports/Dashboards/SQL/Evidence/Timeline are published or persisted projections and do not invent rows. Phase 97 root-orchestration hardening makes Workspace/Thread/Run inspection fail closed: selection-sensitive requests use scoped generations, commit only complete owner-validated snapshots, and cannot let stale data/error/loading/pending state cross the active context.
  - Phase 98 adds local password credential exchange and CLI-only administrator provisioning without creating a second AuthN/AuthZ path. The requested local administrator and a non-private Model Gateway endpoint were validated through PostgreSQL and a complete Harness Run. Password recovery remains operator-driven rotation; DingTalk and WeCom live tenants remain untested. Local evidence does not satisfy any production promotion gate.

