[tool.uv.workspace]
members = [
  "services/control-plane",
  "packages/sdk-python",
  "apps/cli",
  "apps/im-adapter",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["services/control-plane/src", "packages/sdk-python/src", "apps/cli/src", "apps/im-adapter/src"]
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"services/control-plane/src/obsion/api/*.py" = ["B008"]
"services/control-plane/src/obsion/security/auth.py" = ["B008"]
"services/control-plane/src/obsion/config.py" = ["S104"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["services/control-plane/tests", "packages/sdk-python/tests", "apps/cli/tests", "apps/im-adapter/tests"]
asyncio_mode = "auto"
markers = [
  "live: opt-in tests against an operator-owned external tenant; never enabled in default CI",
  "feishu_browse_live: opt-in non-writing Feishu source browse through Capability Gateway",
  "feishu_send_live: opt-in single-message Feishu delivery to an explicit operator chat; never enabled in default CI",
]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["obsion.db.models", "obsion.api.admin"]
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["asyncpg", "croniter", "openpyxl", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
