[project]
name = "obsion-cli"
version = "0.1.0"
description = "Official Obsion Experience CLI. Talks to App Server and REST; never implements Harness."
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "obsion-sdk[app-server]",
]

[project.scripts]
obsion-cli = "obsion_cli.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsion_cli"]

[tool.uv.sources]
obsion-sdk = { workspace = true }
