[project]
name = "obsion-im"
version = "0.1.0"
description = "Official Obsion Experience IM adapter. Translates inbound envelopes onto App Server, hosts a loopback webhook, renders local-outbox replies, and supports explicit governed Feishu, DingTalk, and WeCom HTTP delivery without implementing Harness."
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "cryptography>=44,<51",
  "httpx>=0.28,<1",
  "obsion-cli",
  "obsion-sdk[app-server]",
]

[project.scripts]
obsion-im = "obsion_im.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsion_im"]

[tool.uv.sources]
obsion-cli = { workspace = true }
obsion-sdk = { workspace = true }
