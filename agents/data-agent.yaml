apiVersion: obsion.dev/v1
kind: Agent
metadata:
  name: data-agent
spec:
  description: Governed semantic analytics agent
  modelPolicy: {profile: reasoning-high}
  maxSteps: 18
  skills: [governed-analytics]
  capabilities: [metric.describe, schema.search, sql.validate, sql.explain, data.query, data.preview]
  riskPolicy: {maxLevel: L2}
