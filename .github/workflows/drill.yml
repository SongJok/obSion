name: DR drill

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OBSION_DR_DRILL: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.16"
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: uv sync --locked --all-packages --all-extras
      - name: PostgreSQL backup/restore drill
        run: >-
          uv run obsion record-drill-evidence
          --output "$RUNNER_TEMP/backup-restore-drill.yaml"
      - name: Artifact-store backup/restore drill
        run: >-
          uv run obsion record-artifact-drill-evidence
          --output "$RUNNER_TEMP/artifact-store-drill.yaml"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: drill-ledgers
          path: |
            ${{ runner.temp }}/backup-restore-drill.yaml
            ${{ runner.temp }}/artifact-store-drill.yaml
          if-no-files-found: error
          retention-days: 14
