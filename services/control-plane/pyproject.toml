[project]
name = "obsion-control-plane"
version = "0.1.0"
description = "Obsion enterprise agent runtime and control plane"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Obsion contributors"}]
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "croniter>=6,<7",
  "jsonschema>=4.24,<5",
  "minio>=7.2,<8",
  "orjson>=3.10,<4",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.57b0,<1",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.11,<3",
  "email-validator>=2.2,<3",
  "pydantic-settings>=2.10,<3",
  "pgvector>=0.5,<1",
  "pypdf>=5.7,<6",
  "pyyaml>=6.0.2,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
  "pyjwt[crypto]>=2.10,<3",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "sqlglot>=27,<28",
  "structlog>=25,<26",
  "uuid6>=2025.0.1,<2026",
  "uvicorn[standard]>=0.35,<1",
  "obsion-sdk",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "hypothesis>=6.135,<7",
  "httpx2>=2.12,<3",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[project.scripts]
obsion = "obsion.cli:main"
obsion-api = "obsion.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsion"]
artifacts = ["src/obsion/contracts/**/*.json"]

[tool.uv.sources]
obsion-sdk = { workspace = true }
