apiVersion: obsion.dev/v1
kind: Skill
metadata:
  name: incident-investigation
spec:
  instructions:
    - establish baseline
    - locate anomaly
    - segment
    - correlate changes
    - inspect logs and traces
    - test alternatives
  capabilities:
    - metric.anomaly
    - metric.dimension
    - log.aggregate
    - trace.search
    - deployment.list
    - git.diff
    - config.diff
  requiredEvidence: [METRIC, DEPLOYMENT, LOG]
  optionalEvidence: [TRACE, CODE, CONFIG]
  verification: [temporal consistency, conflicting causes, evidence coverage]
